<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>반도체 채용 &amp; 뉴스 현황판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family:'Pretendard',-apple-system,system-ui,sans-serif; background-color:#0b0f19; color:#f8fafc; user-select:none; cursor:none; }
    @keyframes ticker { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    .animate-ticker { display:flex; width:max-content; animation:ticker 40s linear infinite; }
    .progress-transition { transition:width 1s linear; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between p-5 gap-4 bg-gradient-to-br from-[#0b0f19] via-[#111827] to-[#0f172a]">

  <!-- 상단 헤더 -->
  <header class="h-[9%] bg-slate-900/90 border border-slate-700/70 rounded-2xl px-6 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-4">
      <div class="w-3.5 h-10 bg-cyan-400 rounded-full shadow-[0_0_12px_#22d3ee]"></div>
      <div>
        <div class="flex items-center gap-2.5">
          <h1 class="text-2xl font-extrabold tracking-tight text-white">SEMICONDUCTOR LIVE BOARD</h1>
          <span id="sample-badge" class="hidden px-2.5 py-0.5 text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-full">샘플 데이터</span>
          <span id="stale-badge" class="hidden px-2.5 py-0.5 text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40 rounded-full">데이터 갱신 지연</span>
        </div>
        <p class="text-sm text-slate-400">반도체 채용 현황 및 산업 뉴스 브리핑</p>
      </div>
    </div>

    <!-- 실제 데이터에서 계산되는 지표만 표시 -->
    <div class="flex items-center gap-3">
      <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl px-4 py-2 flex items-center gap-3">
        <span class="text-xs font-semibold text-slate-400">모집 중 공고</span>
        <span id="m-total" class="text-lg font-extrabold text-cyan-400">-</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl px-4 py-2 flex items-center gap-3">
        <span class="text-xs font-semibold text-slate-400">마감 임박 (7일)</span>
        <span id="m-urgent" class="text-lg font-extrabold text-rose-400">-</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl px-4 py-2 flex items-center gap-3">
        <span class="text-xs font-semibold text-slate-400">데이터 갱신</span>
        <span id="m-updated" class="text-base font-bold text-slate-200">-</span>
      </div>
    </div>

    <div class="flex items-center gap-5">
      <button onclick="toggleAutoPlay()" class="px-4 py-2.5 rounded-xl bg-slate-800 active:scale-95 border border-slate-600 text-sm font-semibold flex items-center gap-2 transition">
        <span id="play-icon" class="text-emerald-400">⏸</span>
        <span id="play-text">자동롤링 중 (15s)</span>
      </button>
      <div class="text-right">
        <div id="current-date" class="text-sm font-medium text-slate-400">&nbsp;</div>
        <div id="current-time" class="text-3xl font-black tracking-wider text-white tabular-nums">--:--:--</div>
      </div>
    </div>
  </header>

  <!-- 중앙 -->
  <main class="h-[81%] grid grid-cols-12 gap-5">
    <section class="col-span-7 bg-slate-900/80 border border-slate-700/70 rounded-2xl p-5 flex flex-col shadow-xl relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1 bg-slate-800">
        <div id="job-progress-bar" class="h-full bg-cyan-400 progress-transition" style="width:0%"></div>
      </div>

      <div class="flex items-center justify-between mb-3 mt-1">
        <div class="flex items-center gap-2">
          <span class="text-2xl">💼</span>
          <h2 class="text-xl font-bold text-white">반도체 채용 공고</h2>
          <span class="text-xs text-slate-400 ml-2">* 직무 탭을 터치하면 필터링됩니다</span>
        </div>
        <div id="job-page-indicator" class="text-sm font-bold text-cyan-400 bg-cyan-950/60 border border-cyan-800/60 px-3 py-1 rounded-lg">Page 1 / 1</div>
      </div>

      <div id="category-filters" class="flex items-center gap-2.5 mb-4"></div>

      <div id="job-list-container" class="grid grid-cols-2 gap-3.5 flex-1"></div>
    </section>

    <section class="col-span-5 bg-slate-900/80 border border-slate-700/70 rounded-2xl p-5 flex flex-col shadow-xl">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="text-2xl">📰</span>
          <h2 class="text-xl font-bold text-white">오늘의 반도체 뉴스</h2>
        </div>
        <span class="text-xs font-medium text-slate-400 bg-slate-800/80 border border-slate-700 px-2.5 py-1 rounded-lg">매일 아침 자동 수집</span>
      </div>
      <div id="news-list-container" class="flex flex-col gap-3.5 flex-1 justify-between"></div>
    </section>
  </main>

  <!-- 하단 티커 -->
  <footer class="h-[7%] bg-slate-900/95 border border-slate-700/80 rounded-2xl px-4 flex items-center overflow-hidden shadow-lg">
    <div class="bg-amber-500 text-slate-950 font-extrabold text-sm px-3.5 py-1.5 rounded-lg mr-4 shrink-0 flex items-center gap-1.5 shadow"><span>⚡</span> 안내</div>
    <div class="overflow-hidden whitespace-nowrap w-full relative">
      <div id="ticker-container" class="animate-ticker text-base font-medium text-slate-200 flex items-center"></div>
    </div>
  </footer>

<script>
  // data.json 이 유일한 데이터 소스. 화면에는 계산 가능한 값만 띄운다.
  const S = { jobs: [], news: [], ticker: [], updatedAt: '', updatedAtISO: '', sample: false };
  const CATEGORIES = ['전체', '공정/소자', '첨단패키징', '회로설계', '장비/설비', '품질/테스트'];
  const ROLLING_INTERVAL = 15;
  const itemsPerPage = 4;

  let currentCategory = '전체';
  let currentPage = 0;
  let isAutoPlaying = true;
  let timerSeconds = 0;
  let activeNewsIndex = 0;

  const qr = link => `https://api.qrserver.com/v1/create-qr-code/?size=90x90&margin=4&data=${encodeURIComponent(link || '')}`;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // 마감일로 D-day를 매번 계산한다. 파이프라인이 멈춰도 날짜가 틀리지 않고, 지난 공고는 자동으로 사라진다.
  function dday(deadline) {
    // 마감일을 모르는 공고를 '상시채용'이라 단정하지 않는다. QR로 원문을 보게 한다.
    if (!deadline) return { text: '마감일 확인', urgent: false };
    const end = new Date(deadline + 'T23:59:59+09:00');
    if (isNaN(end)) return { text: '마감일 확인', urgent: false };
    const d = Math.ceil((end - Date.now()) / 86400000);
    if (d < 0) return null;
    return { text: d === 0 ? '오늘 마감' : `D-${d}`, urgent: d <= 7 };
  }

  const liveJobs = () => S.jobs.map(j => ({ ...j, dd: dday(j.deadline) })).filter(j => j.dd);

  function renderFilters() {
    document.getElementById('category-filters').innerHTML = CATEGORIES.map(c => {
      const on = c === currentCategory;
      const style = on ? 'bg-cyan-500 text-slate-950 shadow-md' : 'bg-slate-800 text-slate-300 border border-slate-700';
      return `<button onclick="filterJobs('${c}')" class="px-4 py-2 rounded-xl text-sm font-bold transition active:scale-95 ${style}">${c === '전체' ? '전체' : '#' + c}</button>`;
    }).join('');
  }

  function renderJobs() {
    const all = liveJobs();
    const filtered = currentCategory === '전체' ? all : all.filter(j => j.category === currentCategory);

    document.getElementById('m-total').innerText = `${all.length}건`;
    document.getElementById('m-urgent').innerText = `${all.filter(j => j.dd.urgent).length}건`;

    const totalPages = Math.max(1, Math.ceil(filtered.length / itemsPerPage));
    if (currentPage >= totalPages) currentPage = 0;
    document.getElementById('job-page-indicator').innerText = `Page ${currentPage + 1} / ${totalPages}`;

    const items = filtered.slice(currentPage * itemsPerPage, currentPage * itemsPerPage + itemsPerPage);
    const box = document.getElementById('job-list-container');
    if (!items.length) {
      box.innerHTML = `<div class="col-span-2 flex items-center justify-center text-slate-500 text-lg">표시할 공고가 없습니다</div>`;
      return;
    }
    box.innerHTML = items.map(job => `
      <div class="bg-slate-800/75 border border-slate-700/80 rounded-2xl p-4 flex justify-between items-center gap-3 shadow-md">
        <div class="flex flex-col justify-between h-full flex-1 pr-2">
          <div>
            <div class="flex items-center gap-2 mb-1.5">
              <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">${esc(job.category)}</span>
              <span class="px-2 py-0.5 rounded-md text-xs font-extrabold ${job.dd.urgent ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40' : 'bg-slate-700 text-slate-300'}">${esc(job.dd.text)}</span>
              <span class="text-sm font-extrabold text-amber-300 ml-1">${esc(job.company)}</span>
            </div>
            <h3 class="text-lg font-bold text-white leading-snug line-clamp-2 mb-2">${esc(job.title)}</h3>
          </div>
          <div class="flex items-center gap-4 text-xs text-slate-300 font-medium">
            <span>📍 ${esc(job.location)}</span>
            <span>🎓 ${esc(job.experience)}</span>
          </div>
        </div>
        <div class="flex flex-col items-center justify-center bg-white p-1.5 rounded-xl shrink-0 shadow">
          <img src="${qr(job.url)}" alt="" class="w-16 h-16 object-contain" />
          <span class="text-[10px] font-bold text-slate-800 mt-0.5">공고 스캔</span>
        </div>
      </div>`).join('');
  }

  function renderNews() {
    const box = document.getElementById('news-list-container');
    if (!S.news.length) {
      box.innerHTML = `<div class="flex-1 flex items-center justify-center text-slate-500 text-lg">뉴스 데이터 대기 중</div>`;
      return;
    }
    if (activeNewsIndex >= S.news.length) activeNewsIndex = 0;
    box.innerHTML = S.news.map((n, i) => {
      const on = i === activeNewsIndex;
      return `
      <div onclick="setActiveNews(${i})" class="rounded-2xl p-4 flex justify-between items-center gap-4 transition-all duration-300 ${on ? 'bg-slate-800/95 border-2 border-cyan-400/80 shadow-[0_0_20px_rgba(34,211,238,0.12)]' : 'bg-slate-800/50 border border-slate-700/60 opacity-85'}">
        <div class="flex-1">
          <div class="flex items-center gap-2 mb-1">
            <span class="px-2 py-0.5 rounded text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">${esc(n.tag)}</span>
            <span class="text-xs font-semibold text-slate-400">${esc(n.press)} · ${esc(n.time)}</span>
          </div>
          <h3 class="text-base font-extrabold text-white mb-2 leading-snug">${esc(n.title)}</h3>
          <ul class="space-y-1 text-xs text-slate-300 leading-relaxed">
            ${(n.summary || []).map(l => `<li class="flex items-start gap-1.5"><span class="text-cyan-400 font-bold">•</span><span>${esc(l)}</span></li>`).join('')}
          </ul>
        </div>
        <div class="flex flex-col items-center justify-center bg-white p-1.5 rounded-xl shrink-0 shadow">
          <img src="${qr(n.url)}" alt="" class="w-16 h-16 object-contain" />
          <span class="text-[10px] font-bold text-slate-800 mt-0.5">원문 보기</span>
        </div>
      </div>`;
    }).join('');
  }

  function renderTicker() {
    const once = S.ticker.map(m => `<span class="mx-8">${esc(m)}</span>`).join('<span class="text-slate-600">|</span>');
    document.getElementById('ticker-container').innerHTML = once + '<span class="text-slate-600 mx-8">|</span>' + once;
  }

  function filterJobs(category) {
    currentCategory = category;
    currentPage = 0;
    timerSeconds = 0;
    updateProgressBar();
    renderFilters();
    renderJobs();
  }

  function setActiveNews(i) { activeNewsIndex = i; renderNews(); }

  function toggleAutoPlay() {
    isAutoPlaying = !isAutoPlaying;
    document.getElementById('play-icon').innerText = isAutoPlaying ? '⏸' : '▶';
    document.getElementById('play-icon').className = isAutoPlaying ? 'text-emerald-400' : 'text-amber-400';
    document.getElementById('play-text').innerText = isAutoPlaying ? '자동롤링 중 (15s)' : '일시정지됨 (터치하여 재생)';
  }

  function updateProgressBar() {
    document.getElementById('job-progress-bar').style.width = `${(timerSeconds / ROLLING_INTERVAL) * 100}%`;
  }

  function tick() {
    const now = new Date();
    const days = ['일','월','화','수','목','금','토'];
    document.getElementById('current-date').innerText =
      `${now.getFullYear()}. ${String(now.getMonth()+1).padStart(2,'0')}. ${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]})`;
    document.getElementById('current-time').innerText =
      `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

    if (!isAutoPlaying) return;
    timerSeconds++;
    updateProgressBar();
    if (timerSeconds >= ROLLING_INTERVAL) {
      timerSeconds = 0;
      currentPage++;
      activeNewsIndex = S.news.length ? (activeNewsIndex + 1) % S.news.length : 0;
      renderJobs();
      renderNews();
      updateProgressBar();
    }
  }

  async function loadData() {
    try {
      const res = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();
      Object.assign(S, {
        jobs: d.jobs || [], news: d.news || [], ticker: d.ticker || [],
        updatedAt: d.updatedAt || '', updatedAtISO: d.updatedAtISO || '', sample: !!d.sample
      });
      document.getElementById('m-updated').innerText = S.updatedAt || '-';
      document.getElementById('sample-badge').classList.toggle('hidden', !S.sample);
      // 30시간 넘게 갱신이 없으면 숨기지 말고 드러낸다. 조용히 낡은 화면이 더 위험하다.
      const stale = !S.updatedAtISO || (Date.now() - new Date(S.updatedAtISO)) > 30 * 3600 * 1000;
      document.getElementById('stale-badge').classList.toggle('hidden', !stale);
      renderJobs(); renderNews(); renderTicker();
    } catch (e) {
      console.log('data.json 로드 실패, 기존 화면 유지:', e);
      document.getElementById('stale-badge').classList.remove('hidden');
    }
  }

  // 전자칠판이 절전으로 꺼지지 않게 한다 (Chrome/Edge 지원).
  async function keepAwake() {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  renderFilters();
  renderJobs();
  renderNews();
  loadData();
  keepAwake();
  setInterval(tick, 1000);
  setInterval(loadData, 10 * 60 * 1000);
  setTimeout(() => location.reload(), 6 * 3600 * 1000); // 몇 주 연속 구동 시 메모리/렌더 누적 방지
</script>
</body>
</html>
