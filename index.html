<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>반도체 채용 &amp; 뉴스 현황판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family:'Pretendard',-apple-system,system-ui,sans-serif; background-color:#0b0f19; color:#f8fafc; user-select:none; }
    @keyframes ticker { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    .animate-ticker { display:flex; width:max-content; animation:ticker 40s linear infinite; }
    .progress-transition { transition:width 1s linear; }
    /* 멀리서도 "더 있다"가 보이게 얇지만 또렷한 스크롤바 */
    .scroll-thin { scrollbar-width:auto; scrollbar-color:#64748b #1e293b; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
    .scroll-thin::-webkit-scrollbar { width:14px; }
    .scroll-thin::-webkit-scrollbar-thumb { background:#64748b; border-radius:7px; border:3px solid transparent; background-clip:content-box; }
    .scroll-thin::-webkit-scrollbar-thumb:hover { background:#94a3b8; background-clip:content-box; }
    .scroll-thin::-webkit-scrollbar-track { background:#1e293b; border-radius:7px; }
    [data-url] { cursor:pointer; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between p-5 gap-4 bg-gradient-to-br from-[#0b0f19] via-[#111827] to-[#0f172a]">

  <!-- 상단 헤더 -->
  <header class="h-[9%] bg-slate-900/90 border border-slate-700/70 rounded-2xl px-6 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-4">
      <div class="w-3.5 h-10 bg-cyan-400 rounded-full shadow-[0_0_12px_#22d3ee]"></div>
      <div>
        <div class="flex items-center gap-2.5">
          <h1 class="text-2xl font-extrabold tracking-tight text-white">SEMICONDUCTOR LIVE BOARD</h1>
          <span id="sample-badge" class="hidden px-2.5 py-0.5 text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-full">샘플 데이터</span>
          <span id="stale-badge" class="hidden px-2.5 py-0.5 text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40 rounded-full">데이터 갱신 지연</span>
        </div>
        <p class="text-sm text-slate-400">반도체 채용 현황 및 산업 뉴스 브리핑</p>
      </div>
    </div>

    <!-- 실제 데이터에서 계산되는 지표만 표시 -->
    <div class="flex items-center gap-3">
      <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl px-4 py-2 flex items-center gap-3">
        <span class="text-xs font-semibold text-slate-400">모집 중 공고</span>
        <span id="m-total" class="text-lg font-extrabold text-cyan-400">-</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl px-4 py-2 flex items-center gap-3">
        <span class="text-xs font-semibold text-slate-400">마감 임박 (7일)</span>
        <span id="m-urgent" class="text-lg font-extrabold text-rose-400">-</span>
      </div>
    </div>

    <div class="flex items-center gap-5">
      <button onclick="toggleAutoPlay()" class="px-4 py-2.5 rounded-xl bg-slate-800 active:scale-95 border border-slate-600 text-sm font-semibold flex items-center gap-2 transition">
        <span id="play-icon" class="text-emerald-400">⏸</span>
        <span id="play-text">자동롤링 중 (15s)</span>
      </button>
      <div class="text-right">
        <div id="current-date" class="text-sm font-medium text-slate-400">&nbsp;</div>
        <div id="current-time" class="text-3xl font-black tracking-wider text-white tabular-nums">--:--:--</div>
      </div>
    </div>
  </header>

  <!-- 중앙 -->
  <main class="h-[81%] grid grid-cols-12 gap-5">
    <section class="col-span-7 bg-slate-900/80 border border-slate-700/70 rounded-2xl p-4 flex flex-col shadow-xl relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1 bg-slate-800">
        <div id="job-progress-bar" class="h-full bg-cyan-400 progress-transition" style="width:0%"></div>
      </div>

      <div class="flex items-center justify-between mb-3 mt-1">
        <div class="flex items-center gap-2">
          <span class="text-2xl">💼</span>
          <h2 class="text-xl font-bold text-white">반도체 채용 공고</h2>
          <span id="jobs-stamp" class="text-xs font-semibold text-slate-400 bg-slate-800/80 border border-slate-700 px-2 py-0.5 rounded-md ml-1">-</span>
          <span class="text-xs text-slate-400 ml-1">* 직무 탭을 터치하면 필터링됩니다</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-list" onclick="setView('list')" class="px-3 py-1.5 rounded-lg text-sm font-bold bg-cyan-500 text-slate-950">목록</button>
          <button id="btn-timeline" onclick="setView('timeline')" class="px-3 py-1.5 rounded-lg text-sm font-bold bg-slate-800 text-slate-300 border border-slate-700">📅 마감일</button>
          <button id="btn-calendar" onclick="setView('calendar')" class="px-3 py-1.5 rounded-lg text-sm font-bold bg-slate-800 text-slate-300 border border-slate-700">🗓 달력</button>
          <div id="job-page-indicator" class="text-sm font-bold text-cyan-400 bg-cyan-950/60 border border-cyan-800/60 px-3 py-1 rounded-lg">Page 1 / 1</div>
        </div>
      </div>

      <div id="category-filters" class="flex items-center gap-2 mb-3 flex-wrap"></div>

      <div id="job-list-container" class="grid grid-cols-2 gap-3.5 flex-1"></div>
    </section>

    <section class="col-span-5 bg-slate-900/80 border border-slate-700/70 rounded-2xl p-4 flex flex-col shadow-xl overflow-hidden">
      <div class="flex items-center justify-between mb-2.5">
        <div class="flex items-center gap-2">
          <span class="text-2xl">📰</span>
          <h2 class="text-xl font-bold text-white">오늘의 주요 뉴스</h2>
        </div>
        <span id="news-stamp" class="text-xs font-medium text-slate-400 bg-slate-800/80 border border-slate-700 px-2.5 py-1 rounded-lg">-</span>
      </div>
      <div id="news-daily" class="flex flex-col gap-2.5 flex-1 min-h-0 overflow-y-auto scroll-thin"></div>

      <div class="flex items-center gap-2 mt-3 mb-2.5 pt-3 border-t border-slate-700/70">
        <span class="text-xl">🗓️</span>
        <h2 class="text-lg font-bold text-white">이번 주 핵심 흐름</h2>
      </div>
      <div id="news-weekly" class="flex flex-col gap-2 flex-1 min-h-0 overflow-y-auto scroll-thin"></div>
    </section>
  </main>

  <!-- 하단 티커 -->
  <footer class="h-[7%] bg-slate-900/95 border border-slate-700/80 rounded-2xl px-4 flex items-center overflow-hidden shadow-lg">
    <div class="bg-amber-500 text-slate-950 font-extrabold text-sm px-3.5 py-1.5 rounded-lg mr-4 shrink-0 flex items-center gap-1.5 shadow"><span>⚡</span> 안내</div>
    <div class="overflow-hidden whitespace-nowrap w-full relative">
      <div id="ticker-container" class="animate-ticker text-base font-medium text-slate-200 flex items-center"></div>
    </div>
  </footer>

<script>
  // data.json 이 유일한 데이터 소스. 화면에는 계산 가능한 값만 띄운다.
  // 뉴스는 월~금 아침, 공고는 월·수 아침에 각각 갱신된다. 그래서 수집 시각도 따로 들고 따로 표시한다.
  const S = { jobs: [], news: [], ticker: [], newsAt: '', jobsAt: '', sample: false };
  const STALE_H = { news: 30, jobs: 8 * 24 };   // 이 시간이 지나면 "갱신 지연"
  const CATEGORIES = ['전체', '공정/소자', '첨단패키징', '회로설계', '장비/설비', '품질/테스트'];
  const MAJORS = ['재료', '화학', '전자전기'];
  const ROLLING_INTERVAL = 15;
  const itemsPerPage = 6;

  let currentCategory = '전체';
  let viewMode = 'list';        // 'list' = 카드 목록, 'timeline' = 마감일 순, 'calendar' = 월 달력
  let calOffset = 0;            // 달력에서 이번 달 기준 ±N개월
  let currentPage = 0;
  let isAutoPlaying = true;
  let timerSeconds = 0;
  let activeNewsIndex = 0;

  // "뉴스 10/19 08:00 수집" — 어느 섹션이 언제 수집된 건지 화면에서 바로 보이게.
  function stampText(label, iso) {
    const d = iso && new Date(iso);
    if (!d || isNaN(d)) return `${label} 수집 시각 미상`;
    const p = n => String(n).padStart(2, '0');
    return `${label} ${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())} 수집`;
  }

  // 카드마다 data-url만 달아두면 아래 위임 리스너가 받는다. 터치하면 원문이 새 탭으로 열린다.
  const urlAttr = u => u ? ` data-url="${esc(u)}"` : '';
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-url]');
    if (!el || !el.dataset.url) return;
    // window.open에 features 인자를 주면 크롬이 '팝업'으로 보고 차단한다.
    // 임시 <a>를 눌러 평범한 링크 이동으로 처리한다.
    const a = document.createElement('a');
    a.href = el.dataset.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  const qr = link => `https://api.qrserver.com/v1/create-qr-code/?size=90x90&margin=4&data=${encodeURIComponent(link || '')}`;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // 마감일로 D-day를 매번 계산한다. 파이프라인이 멈춰도 날짜가 틀리지 않고, 지난 공고는 자동으로 사라진다.
  function dday(deadline) {
    // open = 마감일이 정해지지 않은 공고. 모르는 걸 '상시채용'이라 단정하지 않는다.
    if (deadline === '상시') return { text: '상시채용', urgent: false, open: true };
    if (!deadline) return { text: '마감일 확인', urgent: false, open: true };
    const end = new Date(deadline + 'T23:59:59+09:00');
    if (isNaN(end)) return { text: '마감일 확인', urgent: false, open: true };
    const d = Math.ceil((end - Date.now()) / 86400000);
    if (d < 0) return null;
    return { text: d === 0 ? '오늘 마감' : `D-${d}`, urgent: d <= 7 };
  }

  const liveJobs = () => S.jobs.map(j => ({ ...j, dd: dday(j.deadline) })).filter(j => j.dd);
  // 필터 값 하나로 직무 태그와 전공 태그를 함께 받는다. 전공은 한 공고에 여러 개 붙는다.
  const filteredJobs = () => currentCategory === '전체' ? liveJobs()
    : liveJobs().filter(j => j.category === currentCategory || (j.majors || []).includes(currentCategory));
  const pageCount = () => Math.max(1, Math.ceil(filteredJobs().length / itemsPerPage));
  const viewBtnClass = on => `px-3 py-1.5 rounded-lg text-sm font-bold transition active:scale-95 ${
    on ? 'bg-cyan-500 text-slate-950' : 'bg-slate-800 text-slate-300 border border-slate-700'}`;

  function setView(mode) {
    viewMode = mode;
    currentPage = 0;
    calOffset = 0;
    timerSeconds = 0;
    updateProgressBar();
    render();
  }

  function shiftMonth(n) { calOffset += n; timerSeconds = 0; render(); }

  // 목록을 끝까지 넘긴 뒤 마감일 → 달력을 한 번씩 보여주고 처음으로 돌아온다.
  function advance() {
    if (viewMode === 'calendar') { viewMode = 'list'; currentPage = 0; calOffset = 0; }
    else if (viewMode === 'timeline') { viewMode = 'calendar'; calOffset = 0; }
    else if (currentPage + 1 >= pageCount()) viewMode = 'timeline';
    else currentPage++;
  }

  function renderFilters() {
    const chip = (c, label) => {
      const on = c === currentCategory;
      const style = on ? 'bg-cyan-500 text-slate-950 shadow-md' : 'bg-slate-800 text-slate-300 border border-slate-700';
      return `<button onclick="filterJobs('${c}')" class="px-4 py-2 rounded-xl text-sm font-bold transition active:scale-95 ${style}">${label}</button>`;
    };
    const majorChip = c => {
      const on = c === currentCategory;
      const style = on ? 'bg-violet-500 text-white shadow-md' : 'bg-slate-800 text-violet-300 border border-violet-500/40';
      return `<button onclick="filterJobs('${c}')" class="px-3.5 py-2 rounded-xl text-sm font-bold transition active:scale-95 ${style}">${c}</button>`;
    };
    document.getElementById('category-filters').innerHTML =
      CATEGORIES.map(c => chip(c, c === '전체' ? '전체' : '#' + c)).join('') +
      '<span class="w-px h-6 bg-slate-700 mx-1"></span>' +
      '<span class="text-xs font-bold text-slate-500">전공</span>' +
      MAJORS.map(majorChip).join('');
  }

  // 지표·버튼·컨테이너 전환은 여기서 하고, 실제 그리기는 두 렌더러에 맡긴다.
  function render() {
    const all = liveJobs();
    document.getElementById('m-total').innerText = `${all.length}건`;
    document.getElementById('m-urgent').innerText = `${all.filter(j => j.dd.urgent).length}건`;
    document.getElementById('btn-list').className = viewBtnClass(viewMode === 'list');
    document.getElementById('btn-timeline').className = viewBtnClass(viewMode === 'timeline');
    document.getElementById('btn-calendar').className = viewBtnClass(viewMode === 'calendar');

    const box = document.getElementById('job-list-container');
    const label = document.getElementById('job-page-indicator');
    if (viewMode === 'calendar') {
      const m = calBase();
      label.innerText = `${m.getFullYear()}년 ${m.getMonth() + 1}월`;
      box.className = 'flex flex-col flex-1 min-h-0 overflow-hidden';
      renderCalendar();
    } else if (viewMode === 'timeline') {
      label.innerText = '마감 임박순';
      box.className = 'flex flex-col flex-1 min-h-0 overflow-hidden';
      renderTimeline();
    } else {
      if (currentPage >= pageCount()) currentPage = 0;
      label.innerText = `Page ${currentPage + 1} / ${pageCount()}`;
      box.className = 'grid grid-cols-2 gap-3.5 flex-1 min-h-0 overflow-y-auto scroll-thin job-scroll';
      renderJobs();
    }
  }

  function renderJobs() {
    const filtered = filteredJobs();
    const items = filtered.slice(currentPage * itemsPerPage, currentPage * itemsPerPage + itemsPerPage);
    const box = document.getElementById('job-list-container');
    if (!items.length) {
      box.innerHTML = `<div class="col-span-2 flex items-center justify-center text-slate-500 text-lg">표시할 공고가 없습니다</div>`;
      return;
    }
    box.innerHTML = items.map(job => `
      <div${urlAttr(job.url)} class="bg-slate-800/75 border border-slate-700/80 rounded-2xl p-3.5 flex justify-between items-center gap-3 shadow-md transition active:scale-[0.98] active:border-cyan-500/60">
        <div class="flex flex-col justify-between h-full flex-1 pr-2">
          <div>
            <div class="flex items-center gap-1.5 flex-wrap mb-1.5">
              <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">${esc(job.category)}</span>
              ${(job.majors || []).map(mj => `<span class="px-2 py-0.5 rounded-md text-xs font-bold bg-violet-500/15 text-violet-300 border border-violet-500/30">${esc(mj)}</span>`).join('')}
              <span class="px-2 py-0.5 rounded-md text-xs font-extrabold ${job.dd.urgent ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40' : 'bg-slate-700 text-slate-300'}">${esc(job.dd.text)}</span>
              <span class="text-sm font-extrabold text-amber-300 ml-1">${esc(job.company)}</span>
            </div>
            <h3 class="text-base font-bold text-white leading-snug line-clamp-2 mb-1.5">${esc(job.title)}</h3>
          </div>
          <div class="flex items-center gap-4 text-xs text-slate-300 font-medium">
            <span>📍 ${esc(job.location)}</span>
            <span>🎓 ${esc(job.experience)}</span>
          </div>
        </div>
        <div class="flex flex-col items-center justify-center bg-white p-1.5 rounded-xl shrink-0 shadow">
          <img src="${qr(job.url)}" alt="" class="w-14 h-14 object-contain" />
          <span class="text-[10px] font-bold text-slate-800 mt-0.5">공고 스캔</span>
        </div>
      </div>`).join('');
  }

  const calBase = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth() + calOffset, 1); };

  // 사람인 채용 캘린더식 월 달력. 공고를 마감일 칸에 찍는다. QR은 칸이 좁아 뺐고 목록·마감일 화면에서 본다.
  function renderCalendar() {
    const jobs = filteredJobs();
    const base = calBase();
    const y = base.getFullYear(), m = base.getMonth();
    const pad = n => String(n).padStart(2, '0');
    const byDate = {};
    for (const j of jobs) if (!j.dd.open) (byDate[j.deadline] = byDate[j.deadline] || []).push(j);

    const now = new Date();
    const todayKey = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const navBtn = 'px-3 py-1 rounded-lg text-sm font-bold bg-slate-800 text-slate-300 border border-slate-700 active:scale-95';

    let html = `
      <div class="flex items-center justify-between mb-2">
        <button onclick="shiftMonth(-1)" class="${navBtn}">‹ 이전달</button>
        <span class="text-xs font-semibold text-slate-500">마감일 기준 · 지원은 QR이 있는 목록·마감일 화면에서</span>
        <button onclick="shiftMonth(1)" class="${navBtn}">다음달 ›</button>
      </div>
      <div class="grid grid-cols-7 gap-1 mb-1">
        ${days.map((d, i) => `<div class="text-center text-xs font-bold ${i === 0 ? 'text-rose-400' : i === 6 ? 'text-sky-400' : 'text-slate-400'}">${d}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 auto-rows-fr gap-1 flex-1 min-h-0">`;

    for (let i = 0; i < base.getDay(); i++) html += '<div></div>';
    for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
      const key = `${y}-${pad(m + 1)}-${pad(d)}`;
      const list = byDate[key] || [];
      const urgent = list.some(j => j.dd.urgent);
      const tone = !list.length ? 'bg-slate-800/40 border-slate-700/50'
        : urgent ? 'bg-rose-500/15 border-rose-500/40' : 'bg-amber-500/10 border-amber-500/30';
      const ring = key === todayKey ? ' ring-2 ring-cyan-400' : '';
      const dow = new Date(y, m, d).getDay();
      html += `
        <div class="rounded-lg border p-1 flex flex-col gap-0.5 min-h-0 overflow-hidden ${tone}${ring}">
          <span class="text-xs font-black tabular-nums ${dow === 0 ? 'text-rose-300' : dow === 6 ? 'text-sky-300' : 'text-slate-300'}">${d}</span>
          ${list.slice(0, 2).map(j => `<span${urlAttr(j.url)} class="truncate text-[11px] font-bold leading-tight ${urgent ? 'text-rose-200' : 'text-amber-200'}">${esc(j.company)}</span>`).join('')}
          ${list.length > 2 ? `<span class="text-[10px] font-bold text-slate-400">+${list.length - 2}건</span>` : ''}
        </div>`;
    }
    html += '</div>';

    const open = jobs.filter(j => j.dd.open);
    if (open.length) {
      html += `
      <div class="mt-2 pt-2 border-t border-slate-700/70 flex items-center gap-2 flex-wrap">
        <span class="text-sm font-bold text-slate-400 shrink-0">🔄 마감일 없는 공고</span>
        ${open.map(j => `<span${urlAttr(j.url)} class="px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 active:border-cyan-500/60">${esc(j.company)} · ${esc(j.dd.text)}</span>`).join('')}
      </div>`;
    }
    document.getElementById('job-list-container').innerHTML = html;
  }

  // 마감일 순 타임라인. 마감일이 없는 공고는 사라지지 않고 하단에 묶어 둔다.
  function renderTimeline() {
    const jobs = filteredJobs();
    const dated = jobs.filter(j => !j.dd.open).sort((a, b) => a.deadline.localeCompare(b.deadline));
    const open = jobs.filter(j => j.dd.open);
    const box = document.getElementById('job-list-container');

    if (!dated.length && !open.length) {
      box.innerHTML = `<div class="flex-1 flex items-center justify-center text-slate-500 text-lg">표시할 공고가 없습니다</div>`;
      return;
    }

    const days = ['일', '월', '화', '수', '목', '금', '토'];
    let html = '<div class="flex-1 min-h-0 flex flex-col gap-1.5 overflow-y-auto scroll-thin job-scroll">';
    let lastDate = '';
    for (const job of dated) {
      if (job.deadline !== lastDate) {
        lastDate = job.deadline;
        const d = new Date(job.deadline + 'T00:00:00+09:00');
        html += `
        <div class="flex items-center gap-3 mt-2 first:mt-0">
          <span class="text-xl font-black text-white tabular-nums">${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}</span>
          <span class="text-sm font-bold text-slate-400">(${days[d.getDay()]})</span>
          <span class="px-2.5 py-0.5 rounded-md text-sm font-extrabold ${job.dd.urgent ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40' : 'bg-slate-700 text-slate-300'}">${esc(job.dd.text)}</span>
          <div class="flex-1 h-px bg-slate-700/70"></div>
        </div>`;
      }
      html += `
        <div${urlAttr(job.url)} class="bg-slate-800/70 border border-slate-700/70 rounded-xl px-4 py-2 flex items-center gap-3 transition active:scale-[0.99] active:border-cyan-500/60">
          <span class="px-2 py-0.5 rounded text-xs font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 shrink-0">${esc(job.category)}</span>
          <span class="text-base font-extrabold text-amber-300 shrink-0">${esc(job.company)}</span>
          <span class="text-base font-bold text-white truncate flex-1">${esc(job.title)}</span>
          <span class="text-xs text-slate-300 shrink-0">📍 ${esc(job.location)}</span>
          <span class="text-xs text-slate-300 shrink-0">🎓 ${esc(job.experience)}</span>
          <img src="${qr(job.url)}" alt="" class="w-11 h-11 bg-white p-0.5 rounded-lg shrink-0" />
        </div>`;
    }
    html += '</div>';

    if (open.length) {
      html += `
      <div class="mt-2 pt-2.5 border-t border-slate-700/70 flex items-center gap-2 flex-wrap">
        <span class="text-sm font-bold text-slate-400 shrink-0">🔄 마감일 없는 공고</span>
        ${open.map(j => `<span${urlAttr(j.url)} class="px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 active:border-cyan-500/60">${esc(j.company)} · ${esc(j.dd.text)}</span>`).join('')}
      </div>`;
    }
    box.innerHTML = html;
  }

  // 기사 날짜("MM/DD")로 나이를 센다. 12월 기사가 1월에 남아 있으면 작년으로 본다.
  function newsAge(t) {
    const m = /^(\d{1,2})\/(\d{1,2})$/.exec((t || '').trim());
    if (!m) return 0;                                   // 형식이 다르면 거르지 않는다
    const now = new Date();
    const d = new Date(now.getFullYear(), m[1] - 1, m[2]);
    if (d - now > 7 * 864e5) d.setFullYear(d.getFullYear() - 1);
    return Math.floor((now - d) / 864e5);
  }

  // 오래된 기사가 "오늘"·"이번 주" 칸에 눌러앉지 않게 거른다. 비면 빈 칸이 뜨는 쪽이 맞다.
  function newsLists() {
    const daily = S.news.filter(n => (n.scope || 'daily') === 'daily' && newsAge(n.time) <= 4);
    const weekly = S.news.filter(n => n.scope === 'weekly' && newsAge(n.time) <= 14);
    return { daily, weekly, total: daily.length + weekly.length };
  }

  function renderNews() {
    const { daily, weekly, total } = newsLists();
    if (activeNewsIndex >= total) activeNewsIndex = 0;
    paintNews('news-daily', daily, 0, false);
    paintNews('news-weekly', weekly, daily.length, true);
  }

  // compact = 주간 카드. 요약 1줄·작은 QR로 줄여 일간 카드가 눈에 먼저 들어오게 한다.
  function paintNews(id, items, offset, compact) {
    const box = document.getElementById(id);
    if (!items.length) {
      box.innerHTML = `<div class="text-slate-500 text-sm py-2">표시할 뉴스가 없습니다</div>`;
      return;
    }
    box.innerHTML = items.map((n, i) => {
      const gi = offset + i;
      const on = gi === activeNewsIndex;
      const lines = compact ? (n.summary || []).slice(0, 1) : (n.summary || []);
      return `
      <div onclick="setActiveNews(${gi})"${urlAttr(n.url)} class="rounded-2xl ${compact ? 'p-2.5' : 'p-3.5'} flex justify-between items-center gap-3 transition-all duration-300 ${on ? 'bg-slate-800/95 border-2 border-cyan-400/80 shadow-[0_0_20px_rgba(34,211,238,0.12)]' : 'bg-slate-800/50 border border-slate-700/60 opacity-85'}">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="px-2 py-0.5 rounded text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">${esc(n.tag)}</span>
            <span class="text-xs font-semibold text-slate-400">${esc(n.press)} · ${esc(n.time)}</span>
          </div>
          <h3 class="${compact ? 'text-sm' : 'text-base'} font-extrabold text-white mb-1.5 leading-snug">${esc(n.title)}</h3>
          <ul class="space-y-1 text-xs text-slate-300 leading-relaxed">
            ${lines.map(l => `<li class="flex items-start gap-1.5"><span class="text-cyan-400 font-bold">•</span><span>${esc(l)}</span></li>`).join('')}
          </ul>
        </div>
        <div class="flex flex-col items-center justify-center bg-white p-1.5 rounded-xl shrink-0 shadow">
          <img src="${qr(n.url)}" alt="" class="${compact ? 'w-11 h-11' : 'w-14 h-14'} object-contain" />
          <span class="text-[10px] font-bold text-slate-800 mt-0.5">원문</span>
        </div>
      </div>`;
    }).join('');

    // 잘려 있는 카드도 순번이 오면 저절로 보이게. 아무도 안 만져도 전체가 돌아간다.
    const on = box.children[activeNewsIndex - offset];
    if (on) on.scrollIntoView({ block: 'nearest' });
  }

  function renderTicker() {
    const once = S.ticker.map(m => `<span class="mx-8">${esc(m)}</span>`).join('<span class="text-slate-600">|</span>');
    document.getElementById('ticker-container').innerHTML = once + '<span class="text-slate-600 mx-8">|</span>' + once;
  }

  function filterJobs(category) {
    currentCategory = category;
    currentPage = 0;
    timerSeconds = 0;
    updateProgressBar();
    renderFilters();
    render();
  }

  function setActiveNews(i) { activeNewsIndex = i; renderNews(); }

  function setAutoPlay(on, held) {
    isAutoPlaying = on;
    if (on) timerSeconds = 0;
    document.getElementById('play-icon').innerText = on ? '⏸' : '▶';
    document.getElementById('play-icon').className = on ? 'text-emerald-400' : 'text-amber-400';
    document.getElementById('play-text').innerText = on ? '자동롤링 중 (15s)'
      : (held ? '보는 중 — 1분 뒤 자동 재개' : '일시정지됨 (터치하여 재생)');
    updateProgressBar();
  }

  function toggleAutoPlay() {
    clearTimeout(holdTimer);
    setAutoPlay(!isAutoPlaying, false);
  }

  // 손으로 스크롤하는 중에 화면이 넘어가면 읽을 수가 없다. 1분간 멈췄다가 알아서 되돌아간다.
  let holdTimer = null;
  function holdAutoPlay() {
    if (isAutoPlaying) setAutoPlay(false, true);
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => setAutoPlay(true, false), 60000);
  }
  for (const ev of ['wheel', 'touchstart', 'pointerdown']) {   // 'scroll'은 넣지 마라: scrollIntoView가 스스로 쏜다
    document.addEventListener(ev, e => {
      if (e.target.closest && e.target.closest('.scroll-thin')) holdAutoPlay();
    }, { passive: true, capture: true });
  }

  function updateProgressBar() {
    document.getElementById('job-progress-bar').style.width = `${(timerSeconds / ROLLING_INTERVAL) * 100}%`;
  }

  function tick() {
    const now = new Date();
    const days = ['일','월','화','수','목','금','토'];
    document.getElementById('current-date').innerText =
      `${now.getFullYear()}. ${String(now.getMonth()+1).padStart(2,'0')}. ${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]})`;
    document.getElementById('current-time').innerText =
      `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

    if (!isAutoPlaying) return;
    timerSeconds++;
    updateProgressBar();
    if (timerSeconds >= ROLLING_INTERVAL) {
      timerSeconds = 0;
      advance();
      const nv = newsLists().total;
      activeNewsIndex = nv ? (activeNewsIndex + 1) % nv : 0;
      render();
      renderNews();
      updateProgressBar();
    }
  }

  async function loadData() {
    try {
      const res = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();
      Object.assign(S, {
        jobs: d.jobs || [], news: d.news || [], ticker: d.ticker || [],
        // 구버전 data.json(단일 updatedAtISO)도 그대로 읽히게 둔다
        newsAt: d.newsUpdatedAt || d.updatedAtISO || '',
        jobsAt: d.jobsUpdatedAt || d.updatedAtISO || '', sample: !!d.sample
      });
      document.getElementById('news-stamp').innerText = stampText('뉴스', S.newsAt);
      document.getElementById('jobs-stamp').innerText = stampText('공고', S.jobsAt);
      document.getElementById('sample-badge').classList.toggle('hidden', !S.sample);
      // 갱신이 끊기면 숨기지 말고 드러낸다. 조용히 낡은 화면이 더 위험하다.
      const old = [['뉴스', S.newsAt, STALE_H.news], ['공고', S.jobsAt, STALE_H.jobs]]
        .filter(([, iso, h]) => !iso || Date.now() - new Date(iso) > h * 3600 * 1000)
        .map(([label]) => label);
      const badge = document.getElementById('stale-badge');
      badge.innerText = `${old.join('·')} 갱신 지연`;
      badge.classList.toggle('hidden', !old.length);
      render(); renderNews(); renderTicker();
    } catch (e) {
      console.log('data.json 로드 실패, 기존 화면 유지:', e);
      document.getElementById('stale-badge').classList.remove('hidden');
    }
  }

  // 전자칠판이 절전으로 꺼지지 않게 한다 (Chrome/Edge 지원).
  async function keepAwake() {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  renderFilters();
  render();
  renderNews();
  loadData();
  keepAwake();
  setInterval(tick, 1000);
  setInterval(loadData, 10 * 60 * 1000);
  setTimeout(() => location.reload(), 6 * 3600 * 1000); // 몇 주 연속 구동 시 메모리/렌더 누적 방지
</script>
</body>
</html>
